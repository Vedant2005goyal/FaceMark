# MySQL + REST API + scheduler. Credentials come from .env (copy .env.example).
# The webcam loop (attendance.py) runs on the host, since containers have no camera or screen.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql  # runs on first start only

  api:
    build: .
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      API_PORT: 5000
    ports:
      - "5050:5000"
    volumes:
      - ./sample_faces:/app/sample_faces  # photos added on the host are visible without a rebuild
    depends_on:
      - mysql

  scheduler:
    build: .
    command: python scheduler.py
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    depends_on:
      - mysql

volumes:
  mysql_data:
